name: Trinity CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-ml-rl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLRL01/requirements.txt
          pip install -r api_gateway/requirements.txt
          
      - name: Run quick engine check
        run: |
          python MLRL01/main.py --timesteps 100 --mc_simulations 5

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mlrl03/package-lock.json
          
      - name: Install dependencies
        working-directory: mlrl03
        run: npm ci --legacy-peer-deps
        
      - name: Build Next.js application
        working-directory: mlrl03
        run: npm run build
